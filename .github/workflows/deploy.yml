# CI/CD du portfolio
# ------------------------------------------------------------------------------------------
# Quand ? À chaque push sur main, à chaque pull request, ou à la main (onglet Actions).
# Quoi ?  4 contrôles qui tournent en parallèle, puis le déploiement sur GitHub Pages
#         (uniquement depuis main, et uniquement si les 4 contrôles sont verts).
#
#   coherence ─┐
#   html ──────┼──► deployer (main seulement)
#   liens ─────┤
#   lighthouse ┘
#
# Retour à une ancienne version (sans toucher au code) : Actions → « Vérifier et déployer »
# → Run workflow → version = v2.0 (ou : gh workflow run deploy.yml -f version=v2.0).
# Les contrôles sont alors sautés (la version a déjà été vérifiée) et ce tag est republié tel quel.
# ------------------------------------------------------------------------------------------
name: Vérifier et déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Remettre en ligne une version existante (ex. v2.0). Vide = déployer main après les contrôles."
        required: false
        default: ""

# Droits minimaux par défaut : lire le code. Le job de déploiement demande les siens.
permissions:
  contents: read

# Une nouvelle exécution sur la même branche annule la précédente (inutile de finir un vieux run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    name: Cohérence des données et contenu généré
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Syntaxe JS, fichiers référencés, cohérence projets / compétences, liens vers le site
      - run: node scripts/verifier.js
      # Le HTML statique, le JSON-LD et llms.txt doivent correspondre aux fichiers js/data
      - run: node scripts/generer.js --verifier

  html:
    name: Validation HTML
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Règles dans .htmlvalidate.json
      - run: npx --yes html-validate@11.21.0 index.html projets/*/index.html outils/image-partage.html

  liens:
    name: Liens cassés
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Réglages dans lychee.toml (codes acceptés, liens ignorés)
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress index.html 'projets/*/index.html' llms.txt README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Audit Lighthouse
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/construire.sh
      # Seuils dans lighthouserc.json ; le rapport est publié sur un lien public temporaire
      # (affiché dans le journal de cette étape).
      - run: npx --yes @lhci/cli@0.16.1 autorun

  deployer:
    name: Déployer sur GitHub Pages
    needs: [coherence, html, liens, lighthouse]
    # Après des contrôles verts, ou contrôles sautés quand on republie une version existante
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.sha }}
      - name: Ne publier que le site (sans docs, outils, scripts)
        # Les très anciennes versions (v1.0) n'ont pas scripts/construire.sh : copie minimale
        run: |
          if [ -f scripts/construire.sh ]; then bash scripts/construire.sh
          else mkdir _site && cp -r index.html css js assets _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
