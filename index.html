<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Adebayo Moutalabi · Cloud &amp; DevOps · Agents IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Adebayo Moutalabi, Cloud &amp; DevOps et agents IA, basé à Rennes : parcours, projets, compétences et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..700;1,9..144,200..700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/labo-projets.css">
<link rel="stylesheet" href="css/contact-dock.css">
<link rel="stylesheet" href="css/parcours-competences.css">
<link rel="stylesheet" href="css/mascotte.css">
</head>
<body>
<!-- Écran uni affiché avant le démarrage du JS (évite un flash de la page) -->
<div class="pre-boot" id="pre-boot"></div>

<canvas id="sky" aria-hidden="true"></canvas>

<!-- Barre de progression + mascotte (remplie par js/bit.js) -->
<div class="rail" id="rail" aria-label="Progression de la page">
  <div class="rail-in">
    <div class="rail-track" aria-hidden="true"><i class="rail-fill" id="rail-fill"></i></div>
    <div id="rail-mks"></div>
    <div class="rail-bot" id="rail-bot" aria-hidden="true"><div class="rail-say" id="rail-say"></div><div class="flip" id="rail-flip"><div class="bob" id="rail-b"></div></div></div>
    <span class="rail-now" id="rail-now" aria-hidden="true"></span>
  </div>
</div>

<!--
  Le contenu des sections est généré par js/render.js à partir des fichiers js/data/*.js.
  Ne remplissez pas ces sections ici : modifiez plutôt les fichiers de données.
  L'attribut data-shape choisit la forme du fond (constellation) pendant que la section est visible.
-->
<main id="top">
  <section class="intro" id="intro" aria-label="Accueil" data-shape="sphere">
    <div class="stage" id="stage">
      <div class="name" aria-hidden="true">
        <span class="nrow r1" id="r1"></span>
        <span class="nrow r2" id="r2"></span>
      </div>
      <svg class="orbit" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" stroke-opacity=".45" stroke-width=".3"/>
        <circle cx="50" cy="2" r="1.3" fill="var(--ground)" stroke-width=".3"/>
        <circle cx="98" cy="50" r="1.3" fill="var(--ground)" stroke-width=".3"/>
        <circle cx="16" cy="84" r="1.3" fill="var(--ground)" stroke-width=".3"/>
        <circle cx="84" cy="84" r="2.2" style="fill:var(--gold);stroke:none"/>
      </svg>
      <div class="lens" id="lens"><img id="lens-img" src="" alt="" width="640" height="640"></div>
      <div class="over" id="over">
        <div class="wrap"></div>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </section>

  <section class="who gut" id="choix" data-shape="ring"><div class="wrap"></div></section>
  <section class="sec gut" id="labo" style="padding-top:0" data-shape="cube"><div class="wrap"></div></section>
  <section class="sec gut" id="competences" style="padding-top:0" data-shape="galaxy"><div class="wrap"></div></section>
  <section class="sec gut" id="methode" style="padding-top:0" data-shape="helix"><div class="wrap"></div></section>
  <section class="sec gut" id="projets" style="padding-top:0" data-shape="wave"><div class="wrap"></div></section>
  <section class="sec gut" id="parcours" style="padding-top:0" data-shape="torus"><div class="wrap"></div></section>
  <section class="gut" id="contact" data-shape="sphere" style="padding-bottom:40px"><div class="wrap"></div></section>
</main>

<!-- Dock (barre du bas) : pour ajouter un lien, copiez une ligne <a class="dk"…> et adaptez href / data-s -->
<nav class="dock" id="dock" aria-label="Navigation principale">
  <a class="dk" href="#top" data-s="intro"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span class="lbl">Accueil</span></a>
  <a class="dk" href="#labo" data-s="labo"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg><span class="lbl">Labo</span></a>
  <a class="dk" href="#projets" data-s="projets"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span class="lbl">Projets</span></a>
  <a class="dk" href="#parcours" data-s="parcours"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M9 7V4h6v3"/></svg><span class="lbl">Parcours</span></a>
  <a class="dk" href="#contact" data-s="contact"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span class="lbl">Contact</span></a>
  <span class="sep"></span>
  <button type="button" class="dk" id="dk-term" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/></svg><span class="lbl">Terminal</span></button>
  <button type="button" class="dk desk" id="dk-theme" aria-label="Changer de thème"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl">Thème</span></button>
</nav>

<div class="sheet-bg" id="sheet-bg" hidden>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></aside>
</div>

<div class="pal-bg" id="pal-bg" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Terminal de commandes">
    <input id="pal-in" type="text" placeholder="Tapez : deploy, labo, projets, contact…" autocomplete="off" aria-label="Commande">
    <ul id="pal-list" role="listbox"></ul>
    <div class="ph">↑ ↓ pour choisir · Entrée pour lancer · Échap pour fermer</div>
  </div>
</div>


<!-- Données de contenu (c'est ICI que vous modifiez le site) -->
<script src="js/utils.js"></script>
<script src="js/data/profil.js"></script>
<script src="js/data/visiteurs.js"></script>
<script src="js/data/labo.js"></script>
<script src="js/data/competences.js"></script>
<script src="js/data/methode.js"></script>
<script src="js/data/vignettes.js"></script>
<script src="js/data/projets.js"></script>
<script src="js/data/parcours.js"></script>
<script src="js/data/contact.js"></script>
<script src="js/data/mascotte.js"></script>

<!-- Code (à ne modifier que pour changer le comportement) -->
<script src="js/render.js"></script>
<script src="js/hero.js"></script>
<script src="js/labo.js"></script>
<script src="js/competences.js"></script>
<script src="js/methode.js"></script>
<script src="js/projets.js"></script>
<script src="js/parcours.js"></script>
<script src="js/contact.js"></script>
<script src="js/navigation.js"></script>
<script src="js/fond.js"></script>
<script src="js/bit.js"></script>
<script src="js/verifier.js"></script>
<script src="js/main.js"></script>
</body>
</html>
